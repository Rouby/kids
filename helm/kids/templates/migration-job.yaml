apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kids.fullname" . }}-migration
  labels:
    app: {{ include "kids.fullname" . }}-migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ include "kids.fullname" . }}-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "kids.fullname" . }}-migration-sa
      initContainers:
        - name: wait-for-postgres
          image: bitnami/kubectl:1.31
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL StatefulSet to be ready..."
              if ! kubectl wait --for=condition=ready pod -l app={{ include "kids.fullname" . }}-postgres -n {{ .Values.namespace }} --timeout=300s; then
                echo "Error: PostgreSQL pod failed to become ready within 5 minutes"
                echo "Pod status:"
                kubectl get pods -l app={{ include "kids.fullname" . }}-postgres -n {{ .Values.namespace }}
                echo "Pod events:"
                kubectl describe pods -l app={{ include "kids.fullname" . }}-postgres -n {{ .Values.namespace }} | grep -A 20 "Events:"
                exit 1
              fi
              echo "PostgreSQL pod is ready!"
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "server/migrate-standalone.ts"]
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "kids.fullname" . }}-postgres-svc:5432/{{ .Values.postgres.auth.database }}"
