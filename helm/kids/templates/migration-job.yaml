apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kids.fullname" . }}-migration
  labels:
    app: {{ include "kids.fullname" . }}-migration
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ include "kids.fullname" . }}-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL service {{ include "kids.fullname" . }}-postgres-svc to be ready..."
              RETRY_COUNT=0
              MAX_RETRIES=60
              until pg_isready -h {{ include "kids.fullname" . }}-postgres-svc -p 5432 -U {{ .Values.postgres.auth.username }}; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                  echo "Error: PostgreSQL did not become ready after $MAX_RETRIES attempts (2 minutes)"
                  exit 1
                fi
                echo "Waiting for PostgreSQL to be ready... (attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "server/migrate-standalone.ts"]
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "kids.fullname" . }}-postgres-svc:5432/{{ .Values.postgres.auth.database }}"
